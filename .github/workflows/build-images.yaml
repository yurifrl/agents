name: Build upstream images to ghcr

# Build the google/ax component images from an upstream ax ref (unmodified
# public sources) with ko + docker, publishing to public ghcr for the home
# talos cluster. Upstream ax publishes no images: `make deploy
# AX_IMAGE_REPO=...` expects the operator to build from a checkout and push to
# their own registry.
#
# Agent Substrate is NOT built here any more: since v1.0 the substrate release
# workflow publishes every component multi-arch to
# ghcr.io/agent-substrate/substrate/<name>:<tag>, and charts/agent-substrate
# pins those digests directly. (The old loop also no longer works on v1.x:
# cmd/ateom-gvisor was renamed cmd/ateworker-gvisor.)
#
# The workflow's own GITHUB_TOKEN (packages: write) is the only credential.
#
# Charts reference the results (official naming: <registry>/<repo>/<component>):
#   ghcr.io/yurifrl/ax/<name>:<ax_version>     (ax, `make deploy` layout)
# Packages are public (flipped once after the first push).

on:
  workflow_dispatch:
    inputs:
      ax_version:
        description: google/ax ref (tag or commit) to build
        required: true
        default: v0.4.0-rc.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHCR: ghcr.io/${{ github.repository_owner }}
      # ax/go.mod pins a newer go than setup-go may install; setup-ko exports
      # GOTOOLCHAIN=local (overriding this), so the ax build step re-exports
      # auto itself.
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout ax
        uses: actions/checkout@v7
        with:
          repository: google/ax
          ref: ${{ inputs.ax_version }}
          path: ax

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ax/go.mod

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@latest

      - name: Install ko
        uses: ko-build/setup-ko@v0.9

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --platform=linux/amd64: ko defaults also build the base image's other
      # platforms, and their digest-tagged index PUTs are what ghcr DENIED in
      # earlier runs. The charts pin arch: amd64 anyway.
      - name: Build ax images
        env:
          AX_REF: ${{ inputs.ax_version }}
        run: |
          set -euo pipefail
          # setup-ko exports GOTOOLCHAIN=local via GITHUB_ENV, which breaks ax
          # when go.mod asks for a newer toolchain. A script-level export
          # overrides it.
          export GOTOOLCHAIN=auto
          AX="${GHCR}/ax"
          MOD=github.com/google/ax
          TAG="${AX_REF}"
          # ax-server is a plain ko binary image. The task-runner is NOT:
          # ax's guest command is /usr/local/bin/ax-task-runner (not ko's
          # /ko-app/<name>), and the runner needs git/curl/ssh at runtime —
          # upstream's Dockerfile.task-runner + Makefile `images` assemble
          # exactly that. (google/ax main renamed it ax-runner after
          # v0.4.0-rc.1; this step targets refs that still ship
          # cmd/ax-task-runner.)
          # -B (base import path) publishes straight to $AX/ax-server; the
          # default md5-suffixed name is a separate ghcr package this repo's
          # token has no write access to.
          (cd ax && KO_DOCKER_REPO="$AX" ko build -B --sbom=none --platform=linux/amd64,linux/arm64 -t "$TAG" ./cmd/ax-server)
          (cd ax && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/linux_amd64/ax-task-runner ./cmd/ax-task-runner)
          (cd ax && docker build --platform linux/amd64 --build-arg TARGETARCH=amd64 -t "$AX/ax-task-runner:$TAG" -f Dockerfile.task-runner .)
          docker push "$AX/ax-task-runner:$TAG"
          # Claude Code image: the task-runner above plus the claude CLI (a real
          # 0755 binary in /usr/local/bin: tasks may run as non-root and can't
          # follow a symlink into /root), keeping
          # the DEFAULT runner. Upstream's claude-code-runner (Dockerfile.claude-code)
          # never enters pull mode at v0.4.0-rc.1, so it never claims its
          # assignment from ax-server and hangs. Tasks call claude via
          # spec.commands instead of spec.config. Built amd64-native (the
          # claude installer aborts under qemu).
          printf '%s\n' \
            "FROM $AX/ax-task-runner:$TAG" \
            'RUN curl -fsSL https://claude.ai/install.sh | bash -s -- latest && install -m 0755 "$(readlink -f /root/.local/bin/claude)" /usr/local/bin/claude && rm -rf /root/.local/share/claude /root/.local/bin/claude && /usr/local/bin/claude --version' \
            'ENV IS_SANDBOX=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 DISABLE_AUTOUPDATER=1' \
            > /tmp/Dockerfile.claude-code
          docker build --platform linux/amd64 -t "$AX/claude-code:$TAG" -f /tmp/Dockerfile.claude-code /tmp
          docker push "$AX/claude-code:$TAG"

      - name: Verify published images
        env:
          AX_REF: ${{ inputs.ax_version }}
        run: |
          set -euo pipefail
          fail=0
          for ref in "ax/ax-server:$AX_REF" "ax/ax-task-runner:$AX_REF" "ax/claude-code:$AX_REF"; do
            img="$GHCR/$ref"
            # Index manifests: arch per entry in .manifests[].platform.
            # Single manifests (ko output): arch lives in the config blob.
            archs=$(crane manifest "$img" | jq -r 'if .manifests then [.manifests[].platform.architecture] | unique | join(",") else "" end')
            if [ -z "$archs" ]; then archs=$(crane config "$img" | jq -r .architecture); fi
            case "$archs" in *amd64*) : ;; *) echo "MISSING amd64: $img (archs=$archs)"; fail=1 ;; esac
            # Print the digest to pin in charts/ax/values.yaml (images.*.tag).
            echo "ok $img ($archs) $(crane digest "$img")"
          done
          exit $fail
