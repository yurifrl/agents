---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agents-controller
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.yurifrl.dev
  resources:
  - agentskills
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.yurifrl.dev
  resources:
  - agenttasks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.yurifrl.dev
  resources:
  - agenttasks/finalizers
  verbs:
  - update
- apiGroups:
  - agents.yurifrl.dev
  resources:
  - agenttasks/status
  verbs:
  - get
  - patch
  - update
