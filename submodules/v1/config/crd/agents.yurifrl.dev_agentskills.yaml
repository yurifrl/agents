  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: agentskills.agents.yurifrl.dev
spec:
  group: agents.yurifrl.dev
  names:
    kind: AgentSkill
    listKind: AgentSkillList
    plural: agentskills
    shortNames:
    - ask
    singular: agentskill
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.description
      name: Description
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentSkill is a reusable, composable unit of agent instructions
          and tool policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSkillSpec is a reusable bundle of instructions and tool policy that can
              be composed into an agent definition.
            properties:
              description:
                description: Description is a short human-readable summary of the
                  skill.
                minLength: 1
                type: string
              instructions:
