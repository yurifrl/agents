# home talos-default profile. ax images are built from google/ax v0.4.0-rc.1
# and published to public ghcr.io/yurifrl/ax/* by the build-images workflow;
# postgres is the official upstream image. No pull secret.

# ax-server is built multi-arch and postgres is multi-arch upstream, so ax pods
# may run on any node; dell01 (the only amd64 worker) is kept for the substrate.
nodeSelector: {}
# rpi01 is offsite (reaches the cluster over Tailscale): ax-server's postgres
# migrations over that link outlast its liveness probe.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [rpi01]

images:
  server:
    repository: ghcr.io/yurifrl/ax/ax-server
  taskRunner:
    repository: ghcr.io/yurifrl/ax/ax-task-runner

postgres:
  # Longhorn default class; small home footprint.
  storage: 5Gi
  resources:
    requests:
      cpu: 50m
      # dell01 runs close to its allocatable memory.
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

networkPolicy:
  enabled: true
  # ax-system is in the Istio ambient mesh (ArgoCD managedNamespaceMetadata):
  # the tailnet ingress gateway reaches ax-server through ztunnel on HBONE
  # :15008. Worker pods (not meshed) still only see the scoped ports.
  extraIngressPorts: [15008]

# Public images: no registry Secret.
registry:
  password: ""
imagePullSecrets: []
