# Default values for ax.
# Deploys google/ax v0.4.0-rc.1: ax-server (task executor + Gateway API +
# internal runner endpoint) and its PostgreSQL store, into the Helm release
# namespace. ax-server requires a running agent-substrate v1.0.x
# (api.ate-system.svc, idp.ate-system.svc, atenet-router/egress) and its
# podcert cluster trust bundles; deploy agent-substrate first.

ax:
  # -- The ax build version (google/ax git ref the images were built from).
  version: "v0.4.0-rc.1"

replicas:
  server: 1

images:
  # -- ko-built ax-server, published to public ghcr by the build-images
  # workflow (upstream publishes no ax images; deploy/ax-server.yaml takes
  # ${AX_SERVER_IMAGE}). Pin the digest the workflow prints once it ran.
  server:
    repository: ghcr.io/yurifrl/ax/ax-server
    tag: "v0.4.0-rc.1@sha256:6c877c6469603e277c38dc8a41ba5b46c714e51a47f8c895a238cb996974dd57"
  # -- Default task image (AX_DEFAULT_TASK_IMAGE) for Tasks whose
  # spec.profile names no image: upstream Dockerfile.task-runner (python slim
  # + git/curl/ssh + /usr/local/bin/ax-task-runner), built by the same
  # workflow. Empty repository falls back to ax's compiled-in default
  # (gcr.io/ax-substrate/ate-images/ax-task-runner).
  taskRunner:
    repository: ghcr.io/yurifrl/ax/ax-task-runner
    tag: "v0.4.0-rc.1@sha256:062909bcca0784b0a3af0b02cbac7b4478b0ac67bc0f4577c14544c8abfbbc38"
  # -- Optional digest-pinned runner volume image (AX_RUNNER_VOLUME_IMAGE,
  # Dockerfile.runner-volume) mounted read-only into task containers. Empty
  # runs the runner baked into each task image.
  runnerVolume: ""
  # -- ax-postgres image (upstream deploy/postgres.yaml uses
  # postgres:17-alpine), digest-pinned.
  postgres:
    repository: docker.io/library/postgres
    tag: "17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73"

substrate:
  # -- Control-plane endpoint ax-server connects to (gRPC over TLS).
  endpoint: api.ate-system.svc.cluster.local:443
  # -- TLS server name (SNI/hostname verification) and the ServiceAccount
  # token audience for ax-server's substrate connection.
  authority: api.ate-system.svc
  # -- Path of the cluster trust bundle mounted for verifying the substrate
  # control plane (and the ate-idp-server issuer). Served by
  # agent-substrate's podcert servicedns signer.
  caFile: /run/servicedns-ca/trust-bundle.pem
  # -- atenet-router mTLS ingress ax-server reaches task actors through
  # (ATENET_ROUTER_ADDR). ax-server presents its podidentity certificate;
  # agent-substrate's atenetRouter.ingressAllowedSpiffeIds must list
  # spiffe://cluster.local/ns/<release-namespace>/sa/ax-server.
  atenetRouterAddr: https://atenet-router.ate-system.svc.cluster.local:443
  # -- OIDC issuer of the Actor JWTs the egress gateway injects on runner
  # calls to :8081 (AX_ACTOR_JWT_ISSUER); must equal agent-substrate's
  # ateapi.actorJwtIssuer.
  actorJwtIssuer: https://idp.ate-system.svc

runner:
  # -- In-cluster host:port of ax-server's :8081 runner service, written into
  # every task actor's EgressPolicy (AX_RUNNER_ENDPOINT). Empty uses ax's
  # default, ax-server-runner.ax-system.svc.cluster.local:8081 — set it when
  # the release namespace is not ax-system.
  endpoint: ""

template:
  # -- ActorTemplate ax-server fetches from substrate for each task.
  name: default-template
  # -- Substrate atespace holding task ActorTemplates (a substrate
  # concept, unrelated to the Kubernetes release namespace). Tasks run in
  # the `default` atespace; ax-server reads its model-key Secret from the
  # Kubernetes namespace matching this atespace.
  atespace: default

postgres:
  # -- PVC size for ax-postgres (upstream: 10Gi).
  storage: 10Gi
  # -- StorageClass for the PVC; empty uses the cluster default.
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  password:
    # -- Generate the ax-postgres password Secret (key: password) once with
    # the External Secrets Operator Password generator (refreshInterval 0:
    # never rotated, since postgres only reads it at initdb). Set false and
    # create Secret ax-postgres yourself where ESO is absent.
    generate: true

networkPolicy:
  # -- Render upstream's NetworkPolicies: ax-server :8080/:9090 closed to
  # worker pods and atenet-egress, :8081 open only to atenet-egress;
  # ax-postgres open only to ax-server.
  enabled: true
  # -- Extra TCP ports admitted from any non-worker pod on ax-server.
  # Istio ambient delivers meshed traffic (e.g. the ingress gateway) on the
  # HBONE port 15008, which a port-scoped NetworkPolicy would otherwise drop.
  extraIngressPorts: []

otel:
  # -- ax-otel-config ConfigMap (envFrom). Upstream default: no OTLP export,
  # metrics on /metrics (:9090), events on stdout.
  env:
    OTEL_TRACES_EXPORTER: none
    OTEL_METRICS_EXPORTER: prometheus

# -- Model-provider API key, provisioned via External Secrets Operator from
# 1Password. ax resolves the K8s Secret `gemini-api-secret` (fixed
# ax contract, internal/model DefaultSecretName) / key `GEMINI_API_KEY` in the
# task atespace's Kubernetes namespace — NOT the release namespace. The
# 1Password item must contain a field named GEMINI_API_KEY; by repo
# convention the item name equals the ExternalSecret name (see obs/, hermes/).
externalSecret:
  enabled: true
  # -- ExternalSecret name.
  name: ax-gemini-api-secret
  # -- Upstream 1Password item + field holding the model-provider key.
  # Defaults to the shared `litellm` item (the same item litellm proxies
  # Gemini from) so the key is stored exactly once.
  item: litellm
  property: GEMINI_API_KEY
  secretStore:
    # -- ESO store holding the 1Password provider; ClusterSecretStore in
    # the ESO namespace is the repo-wide default.
    kind: ClusterSecretStore
    name: onepassword
  # -- Namespace of the materialized K8s Secret: the atespace namespace
  # ax-server reads secrets from (the substrate `default` atespace maps to
  # the Kubernetes `default` namespace here).
  namespace: default
  # -- ESO refresh interval for the upstream item.
  refreshInterval: 1h
  target:
    # -- K8s Secret name ax reads. Fixed by ax's secret contract; change only
    # together with an ax version that renames it.
    name: gemini-api-secret
    creationPolicy: Owner
    deletionPolicy: Retain

# -- ghcr.io/yurifrl/ax/* is public: no pull Secret, no imagePullSecrets.
# registry.* only builds one when a private registry needs it.
registry:
  server: ghcr.io
  username: yurifrl
  password: ""

# -- imagePullSecrets attached to every ax pod spec (kind profile sets
# [{name: ax-registry}]).
imagePullSecrets: []

# -- Pod nodeSelector for all ax workloads. ax-server/ax-task-runner are
# linux/amd64-only builds (the workflow passes --platform=linux/amd64); when
# this key is ABSENT the helper defaults every pod to kubernetes.io/arch:
# amd64. Set it to {} to opt out.
