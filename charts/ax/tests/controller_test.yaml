suite: ax
templates:
  - deployment-ax-server.yaml
tests:
  - it: couples ax-server to the substrate v1.0 control plane
    documentSelector:
      path: kind
      value: Deployment
    release:
      namespace: ax-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--substrate-authority=api.ate-system.svc"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--store=postgres://ax@ax-postgres.ax-system.svc.cluster.local:5432/ax?sslmode=disable"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--actor-jwt-issuer=https://idp.ate-system.svc"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--template-atespace=default"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATENET_ROUTER_ADDR
            value: https://atenet-router.ate-system.svc.cluster.local:443
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AX_DEFAULT_TASK_IMAGE
            value: ghcr.io/yurifrl/ax/ax-task-runner:v0.4.0-rc.1
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 8081
            name: runner
      - contains:
          path: spec.template.spec.volumes[0].projected.sources
          content:
            serviceAccountToken:
              audience: api.ate-system.svc
              expirationSeconds: 7200
              path: token
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/yurifrl/ax/ax-server:v0.4.0-rc.1"
  - it: exposes the runner port only to atenet-egress
    documentSelector:
      path: kind
      value: NetworkPolicy
    set:
      networkPolicy.extraIngressPorts: [15008]
    asserts:
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 8081
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels.app
          value: atenet-egress
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 15008
  - it: passes a custom runner endpoint through
    documentSelector:
      path: kind
      value: Deployment
    set:
      runner.endpoint: ax-server-runner.ax.svc.cluster.local:8081
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--runner-endpoint=ax-server-runner.ax.svc.cluster.local:8081"
