# ax-postgres: ax-server's store since ax v0.4 (Redis is gone). Ported from
# google/ax v0.4.0-rc.1 deploy/postgres.yaml. It reads its password from
# Secret ax-postgres (key: password), which upstream's `make deploy-postgres`
# creates once with a random value; here ESO's Password generator does the
# same (postgres.password.generate).
{{- if .Values.postgres.password.generate }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ax-postgres
  namespace: {{ .Release.Namespace }}
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ax-postgres
  namespace: {{ .Release.Namespace }}
spec:
  # Generated once and never refreshed: postgres only applies
  # POSTGRES_PASSWORD at initdb, so a rotation would lock ax-server out.
  refreshInterval: "0"
  target:
    name: ax-postgres
    creationPolicy: Owner
    # Keep the password if the ExternalSecret is ever deleted; the data
    # volume still expects it.
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ax-postgres
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ax-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ax-postgres
    app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
spec:
  replicas: 1
  serviceName: ax-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-postgres
        app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
    spec:
      # Give Postgres time for a clean shutdown checkpoint.
      terminationGracePeriodSeconds: 60
      nodeSelector:
        {{- include "ax.nodeSelector" . | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}
          env:
            - name: POSTGRES_USER
              value: ax
            - name: POSTGRES_DB
              value: ax
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ax-postgres
                  key: password
            # A subdirectory, because the volume root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ax", "-d", "ax"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # apiVersion/kind/volumeMode are spelled out so the live object (which the
  # apiserver defaults) does not drift from the rendered one under ArgoCD.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/name: ax-postgres
          app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: ax-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ax-postgres
    app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: ax-postgres
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ax-postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ax-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ax-server
      ports:
        - protocol: TCP
          port: 5432
        {{- range .Values.networkPolicy.extraIngressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
