# Extra provider keys for Gateway credential injection (ax v0.4): each entry
# becomes a Secret labelled ax.io/credential=true, which Substrate's
# k8s-credential-provider hands to a Gateway https rule via
#   credentialUri: ate-secret://k8s.io/<atespace>/<namespace>/<name>/<key>
{{- range .Values.credentials }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ include "ax.partOf" $ }}
spec:
  refreshInterval: {{ $.Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecret.secretStore.kind }}
    name: {{ $.Values.externalSecret.secretStore.name }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: {{ include "ax.partOf" $ }}
          ax.io/credential: "true"
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .item | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}
