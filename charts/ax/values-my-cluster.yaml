# my-cluster profile (Apple container k8s 1.35, single arm64 node; the
# amd64-only ax-server image runs via Rosetta in the node VM — helpers honor
# an explicit {} via hasKey). No ESO on the scratch container cluster: create
# Secret ax-postgres (key: password) by hand, and seed gemini-api-secret into
# the task atespace namespace (default).
nodeSelector: {}

postgres:
  storage: 2Gi
  password:
    generate: false

externalSecret:
  # No External Secrets Operator on the scratch container cluster.
  enabled: false
