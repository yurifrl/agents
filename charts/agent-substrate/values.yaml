# Default values for agent-substrate.
# This chart deploys the ate-system substrate (upstream v1.0.1): ate-api-server,
# ate-idp-server, ate-controller, atelet (DaemonSet), atenet-router/egress on
# agentgateway, podcertificate-controller and the optional Kubernetes Secrets
# credential provider.
# It replaces `ate-setup deploy ate-system` (kustomize + ko) with ArgoCD-managed Helm.

# -- No substrate.version value: the official install does not version-stamp
# the DaemonSet or nodes. Versions live on image tags only
# (values.images.*.tag). Scheduling pins nodes via the generic
# ate.dev/substrate: "true" node label (nostos machineconfig).

images:
  ateapi:
    # -- Upstream release images (ghcr.io/agent-substrate/substrate/<name>),
    # published multi-arch (linux/amd64 + linux/arm64) by the v1.0.1 release
    # workflow and digest-pinned to the index. Since v1.0 upstream publishes
    # its own images, so nothing in this chart is self-built any more.
    repository: ghcr.io/agent-substrate/substrate/ateapi
    tag: "v1.0.1@sha256:5d9f6da2e1446766a48908764891cc3c66cc6ff657279415c0d3839d5e9476ee"
  atecontroller:
    repository: ghcr.io/agent-substrate/substrate/atecontroller
    tag: "v1.0.1@sha256:b63519a821f4c702a689caf5b1ff549a8d6134ac3da94def30c71f914a70d614"
  atelet:
    repository: ghcr.io/agent-substrate/substrate/atelet
    tag: "v1.0.1@sha256:f6707957b470d8a8529e65a4ec3eb1ad5182a607b313b6b1628c7fe6c0e5a9e6"
  idpServer:
    # -- ate-idp-server (new in v1.0): serves the actor-JWT OIDC discovery
    # document and JWKS at https://idp.ate-system.svc from the same
    # actor-id-jwt-pool ate-api-server signs with.
    repository: ghcr.io/agent-substrate/substrate/ate-idp-server
    tag: "v1.0.1@sha256:5d9302255998a3f376cbea8d8860488d20b6c030417c0c3ea7fba53a67f2c9f7"
  podcert:
    # -- podcertificate-controller (publishes the podidentity/servicedns/postgres
    # ClusterTrustBundles the projected volumes use).
    repository: ghcr.io/agent-substrate/substrate/podcertcontroller
    tag: "v1.0.1@sha256:46aa01a624053c23080da41ea37937afc5b544cecf77088ab2196b4ffb734b4f"
  objectStorePlugin:
    # -- object-store plugin: control sidecar next to ate-api-server, node
    # sidecar next to atelet.
    repository: ghcr.io/agent-substrate/substrate/objectstore-plugin
    tag: "v1.0.1@sha256:311cc9cfb9ee8c344f3ebc3e4d5cafb88468840023b62d1c47c6338ed32b0352"
  ateworkerGvisor:
    # -- Worker image the gvisor WorkerPool runs (workerpool-gvisor.yaml).
    # v1.0 renamed cmd/ateom-gvisor to cmd/ateworker-gvisor.
    repository: ghcr.io/agent-substrate/substrate/ateworker-gvisor
    tag: "v1.0.1@sha256:fd0c6a46d6c69d485856171e632906e774594bea9d00011a4d7038be3e084a2a"
  credentialProvider:
    # -- Bundled Kubernetes Secrets credential provider
    # (credentialProvider.enabled): resolves ate-secret://k8s.io/... URIs in
    # EgressPolicy header effects for the egress gateway.
    repository: ghcr.io/agent-substrate/substrate/kubernetes-secrets
    tag: "v1.0.1@sha256:46a2872c624c6e3af98984f1097d2205f012ea6c471516ac5189ceb3adef96e5"
  # -- atenet-router runs the agentgateway image; there is no separate atenet
  # server image in the agentgateway dataplane.
  agentgateway:
    # -- Official agentgateway image, digest-pinned exactly as substrate
    # v1.0.1's components/agentgateway overlay pins it (atenet-router and
    # atenet-egress both run it).
    repository: cr.agentgateway.dev/agentgateway
    tag: "v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b"
  # -- atenet-egress runs the same digest-pinned agentgateway image; its
  # internal dynamicCa bind mints MITM leaves signed by the
  # egress-mitm-ca-pool secret.
  agentgatewayEgress:
    repository: cr.agentgateway.dev/agentgateway
    tag: "v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b"
  postgres:
    # -- Bundled PostgreSQL (see postgres.bundled): official upstream image,
    # digest-pinned (multi-arch: amd64 + arm64).
    repository: docker.io/library/postgres
    tag: "18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15"
  rustfs:
    # -- S3-compatible object store for local clusters
    # (storage.rustfs.enabled): official upstream image, digest-pinned.
    repository: docker.io/rustfs/rustfs
    tag: "1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b"
  awscli:
    # -- Bucket-bootstrap Job image (rustfs.yaml): official upstream image,
    # digest-pinned.
    repository: docker.io/amazon/aws-cli
    tag: "2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1"
  otelcollector:
    # -- In-cluster OTLP collector (otel.collector.enabled): official upstream
    # image, digest-pinned (kind/otel-collector.yaml).
    repository: docker.io/otel/opentelemetry-collector-contrib
    tag: "0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6"
  jaeger:
    # -- Jaeger all-in-one trace store + UI (otel.collector.enabled): official
    # upstream image, digest-pinned.
    repository: docker.io/jaegertracing/all-in-one
    tag: "1.55@sha256:f6b5d09073f14f76873d300f565a6691d815e81bea8e07e1dc3ff67e0596dd4e"

ateapi:
  authentication:
    # -- JWT issuer the api-server trusts for Kubernetes service-account tokens
    # (ate-api-authentication ConfigMap). In-cluster default; on GKE set
    # https://container.googleapis.com/v1/projects/<p>/locations/<l>/clusters/<c>.
    issuer: https://kubernetes.default.svc
    # -- Inject the pod's own projected service-account CA+token into the OIDC
    # discovery client even for a non-default issuer, when that issuer is
    # kube-apiserver itself but not publicly resolvable (talos, self-hosted).
    inClusterDiscovery: false
  # -- hostAliases entries for the ate-api-server pod, needed when the trusted
  # issuer hostname only resolves from outside the cluster (e.g. a LAN DNS
  # name like api.k8s.lan that cluster CoreDNS upstreams don't serve).
  hostAliases: []
  # -- iss claim of minted actor JWTs (ATE_API_ACTOR_JWT_ISSUER), also
  # passed to ate-idp-server as --issuer. The default is the in-cluster
  # ate-idp-server Service (templates/ate-idp-server.yaml), which relying
  # parties such as ax-server's runner endpoint use for OIDC discovery.
  actorJwtIssuer: https://idp.ate-system.svc
  # -- ate-api-server replica count.
  replicas: 2
  # -- apiconfig.textproto logging level (ate-api-config ConfigMap; ate-setup
  # `create api-config`).
  logLevel: info
  authz:
    # -- Principals that are always global owners (--authz-bootstrap-owners,
    # required since v1.0: ate-api-server exits without at least one).
    # Upstream's default is the shared ate-client ServiceAccount. Clients that
    # create atespaces/templates/actors (e.g. ax-server) must be listed or be
    # granted an AccessPolicy by an owner.
    bootstrapOwners:
      - system:serviceaccount:ate-system:ate-client
  # -- Cluster-wide default snapshot location (ATE_API_SNAPSHOT_LOCATION ->
  # --snapshot-location). REQUIRED since v1.0 unless the
  # PerTemplateSnapshotLocation preview gate is on; render fails when empty.
  # On s3/rustfs use s3://<bucket>/[prefix]; snapshots land under
  # <location>/atespaces/.
  snapshotLocation: ""
  # -- GCS-only: the transfer service account the control object-store
  # plugin's credential exchange impersonates. Leave empty on s3 (the S3
  # exchange is unimplemented and never called).
  transferServiceAccount: ""

# ate-idp-server (new in v1.0): actor-JWT OIDC issuer.
idpServer:
  # -- Deploy ate-idp-server + Service idp. ax-server verifies runner Actor
  # JWTs against it, so keep it on whenever ax runs.
  enabled: true
  # -- Replica count (upstream: 2).
  replicas: 2

# atenet-router (agentgateway dataplane, static-mTLS ingress).
atenetRouter:
  # -- SPIFFE IDs allowed through the router's mTLS ingress (agentgateway
  # networkAuthorization rule; replaces ate-setup's
  # [ATE_INGRESS_ALLOWED_SPIFFE_IDS] marker). Empty denies every client on
  # the https/connect-tls gateways. ax-server is
  # spiffe://cluster.local/ns/<ax-namespace>/sa/ax-server.
  ingressAllowedSpiffeIds: []

# Bundled Kubernetes Secrets credential provider
# (manifests/egress-credential-injection, ate-setup --credential-provider
# '{"name":"k8s.io"}'). Lets EgressPolicy header effects reference
# ate-secret://k8s.io/<atespace>/<namespace>/<secret>/<key>; the egress gateway fetches
# the value over mTLS.
credentialProvider:
  # -- Deploy k8s-credential-provider and point atenet-egress at it.
  enabled: false
  # -- namespace-policy.yaml policies (default-deny when empty): which
  # Kubernetes namespaces each atespace may read Secrets from, optionally
  # narrowed by a label selector.
  namespacePolicies: []

# -- ghcr.io/yurifrl/ate/* is public: no pull Secret, no imagePullSecrets.
# registry.* only builds one when a private registry needs it.
imagePullSecrets: []

registry:
  # -- Only used to build the ate-registry pull Secret (see
  # imagePullSecrets) when registry.password is set; never persisted.
  server: ghcr.io
  username: yurifrl
  # -- Token for a PRIVATE registry. Empty creates no Secret.
  password: ""

postgres:
  # -- Deploy the bundled PostgreSQL StatefulSet. ate-setup's default deploy
  # does the same for ate-system; set false when pointing the DSN at RDS or
  # an external server.
  bundled: true
  # -- Full DSN override; empty uses the bundled server's default. Rendered
  # into the ate-api-server-secret-envvars Secret (optional envFrom source).
  connectionString: ""
  # -- ate-api-server rejects an empty schema. official postgressetup creates
  # the substrate schema; only change when the setup.sql in postgres.yaml was
  # edited to match.
  schema: substrate
  # -- Roles ATE_API_POSTGRES_READ_WRITE_ROLE / ATE_API_POSTGRES_OWNER_ROLE
  # assert. Must match the identities setup.sql creates (fixed constants at
  # postgressetup.ReadWriteRole/OwnerRole).
  readWriteRole: substrate_readwrite
  ownerRole: substrate_owner
  # -- Headroom so WAL churn cannot fill the volume (full pg_wal = PANIC).
  # Substrate base is 500Gi; local clusters override to 1Gi.
  storage: 500Gi
  # -- Pod nodeSelector override. Upstream postgres is multi-arch; default
  # `{}` lets it schedule on any untainted node (amd64-only pin can strand it
  # when ko-built workloads fill the only amd64 node).
  nodeSelector: {}
  # -- Upstream sizing sustains control-plane activation load. Local clusters
  # override (kind overlay: 250m/1Gi requests, 2cpu limits).
  resources:
    requests:
      cpu: "2"
      memory: "1Gi"
    limits:
      cpu: "16"
      memory: "2Gi"

atelet:
  # -- Pass GCP credentials for pulling actor images from GCR/Artifact Registry.
  # MUST be false here: the workload/actor images are public ghcr, and atelet's
  # in-process go-containerregistry pulls are anonymous for non-GCP registries.
  gcpAuthForImagePulls: false
  # -- Extra atelet CLI args appended verbatim. The kind profile mirrors the
  # upstream kind overlay: --log-level=debug and
  # --localhost-registry-replacement=kind-registry:5000.
  extraArgs: []

storage:
  # -- Object-store backend for Actor data/snapshots. On EKS: s3
  # (atelet + ate-api-server read AWS credentials from the pod/node IRSA).
  backend: s3
  rustfs:
    # -- Deploy the in-cluster S3-compatible store + inject static AWS
    # credentials into ate-api-server/atelet. Local clusters only.
    enabled: false
    endpoint: "http://rustfs.ate-system.svc:9000"
    accessKey: "rustfsadmin"
    secretKey: "rustfsadmin"
    region: "us-east-1"
    # -- Pod nodeSelector override; upstream rustfs is multi-arch.
    nodeSelector: {}
    storage: 1Gi

otel:
  # -- OTLP endpoint for ate-otel-config (ate-api-server, ate-controller,
  # atelet). Point at the cluster collector; empty string disables export
  # only if the collector isn't deployed.
  exporterOtlpEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  # -- OTLP exporter address used by atenet-router directly.
  exporterOtlpAddress: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  # -- Deploy the in-cluster collector + jaeger (kind profile, see
  # templates/otel-collector.yaml). EKS keeps false: the pre-existing
  # observability-namespace collector receives exports.
  collector:
    enabled: false
  # -- Additional data keys merged into the ate-otel-config ConfigMap. The
  # kind profile sets OTEL_METRIC_EXPORT_INTERVAL, OTEL_METRIC_EXPORT_TIMEOUT
  # (both 10000) and OTEL_LOGS_EXPORTER=otlp, mirroring the upstream overlay.
  extraEnv: {}

podMonitoring:
  # -- Deploy PodMonitoring CR (Google-managed K8s operator CRD) for
  # atenet-router /stats/prometheus scraping. Enable only if the
  # gke-managed-prometheus operator runs on the cluster.
  enabled: false

# ate-system CRDs. Version-coupled to the controllers (ate-setup always
# upgrades them together), so they are rendered as normal resources and
# upgraded by ArgoCD ServerSideApply on every sync.
crds:
  install: true

# Cluster-wide SandboxConfigs + the fail-closed asset validation policy.
sandbox:
  gvisor:
    # -- Apply the cluster-wide gvisor SandboxConfig (name: gvisor-default,
    # cluster-scoped since v1.0).
    enabled: true
    # -- Version actors boot when their template names none.
    defaultVersion: v7
    # -- Named runtime versions, verbatim from substrate v1.0.1
    # manifests/ate-install/sandboxconfig-gvisor.yaml (gVisor releases
    # 20261026.0 and 20261102.0). v1.0 dropped pauseImage; the validating
    # admission policy requires a 'gvisor' tarball asset per architecture.
    versions:
      - name: v6
        state: Enabled
        assets:
          amd64:
            gvisor:
              url: "gs://gvisor/releases/release/20261026.0/x86_64/gvisor.tar.zstd"
              sha256: "708afc62f2ee82d19930c703e85f9dab4f27a78c0aec40c0f55eb1040107f1a7"
          arm64:
            gvisor:
              url: "gs://gvisor/releases/release/20261026.0/aarch64/gvisor.tar.zstd"
              sha256: "6257e49955f13e6caceb2c4181c5dc5406c460e805940c944e67ad65553f5b02"
      - name: v7
        state: Enabled
        assets:
          amd64:
            gvisor:
              url: "gs://gvisor/releases/release/20261102.0/x86_64/gvisor.tar.zstd"
              sha256: "a1439ffbba7d212e0fde32ea79fa9bb51cbc4c5f6c16af1f047260290b861d42"
          arm64:
            gvisor:
              url: "gs://gvisor/releases/release/20261102.0/aarch64/gvisor.tar.zstd"
              sha256: "f702ae92ad7a0c4134be34ca23f52966dbb696db0c0f5b8ec439210ab2cd7c6a"
  microvm:
    # -- Apply the microvm (cloud-hypervisor/kata) SandboxConfig. Opt-in:
    # requires the kata asset set staged in the cluster bucket first.
    enabled: false
    bucket: "ate-cluster-bucket" # -- cluster object-store bucket holding kata-assets/
    assets:
      arm64:
        cloud-hypervisor:
          url: "kata-assets/cloud-hypervisor"
          sha256: "f192b510eea1c710cbc439d716bb0573c223fc463dbe3e6523788a2b7ef62850"
        virtiofsd:
          url: "kata-assets/virtiofsd"
          sha256: "3aa9240045d2261930ef04138fe05cf288f94c867e63e5d0845758bac5e3d458"
        kata-kernel:
          url: "kata-assets/vmlinux"
          sha256: "4960f6cf781274eaa445fc9f88bb8c5ce951649278bc9caa13afb1e99cfe80e6"
        kata-image:
          url: "kata-assets/rootfs.img"
          sha256: "7e3bdd500eb92de17c377bd84f8ed57e50d6bb68c7ec08c88f5e1916cd49f30d"
      amd64:
        cloud-hypervisor:
          url: "kata-assets/cloud-hypervisor"
          sha256: "448af3d4e59b22c2987f7df94c213ad40fb53a10d437e42b5ee6c4fce7c29ecc"
        virtiofsd:
          url: "kata-assets/virtiofsd"
          sha256: "15b2e72a78cc08a9bd8a6943e89fb69c88cb3cbeb63069efceade835342ac7d4"
        kata-kernel:
          url: "kata-assets/vmlinux"
          sha256: "8e9dbc3a6e4c26adb089d23d31201edebce905c7f3e31aa67b32bdd41df1b86f"
        kata-image:
          url: "kata-assets/rootfs.img"
          sha256: "96497f64da1de9c7473fef46c3d29ddd0805d334731cf9d903a21a5b2c33cefb"

# The gvisor WorkerPool (templates/workerpool-gvisor.yaml): substrate worker
# capacity for actors. spec.sandboxClasses (the LIST field) is what the
# controller mirrors onto Worker.sandbox_class — the scheduler rejects actors
# with "no worker has room" when it is empty. The singular legacy
# spec.sandboxClass field is ignored by the controller.
workers:
  gvisor:
    # -- Deploy the gvisor WorkerPool so actors have placement capacity.
    enabled: true
    # -- Worker pod count. Each worker reports node capacity to the substrate
    # scheduler.
    replicas: 1

# Fail-closed ValidatingAdmissionPolicy enforcing per-sandbox-class asset
# requirements (requires k8s >= 1.30; EKS 1.31 OK).
validatingAdmissionPolicy:
  enabled: true

# -- Pod nodeSelector for every workload. When this key is ABSENT the helper
# defaults every pod to kubernetes.io/arch: amd64 (the v1.0 images are
# multi-arch; the pin keeps the control plane next to the amd64 data plane). Set it to {} to opt out entirely on
# single-arch (e.g. arm64) clusters. NOTE: YAML merge means {} here overrides
# cleanly only because the key is not defined in this file.
