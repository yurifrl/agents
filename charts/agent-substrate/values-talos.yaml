# home talos-default profile (k8s 1.37, Longhorn storage, mixed amd64/arm64).
# Mirrors the kind profile shape: rustfs object store with static creds
# (no cloud IAM), in-chart OTLP collector + jaeger (the repo's `monitoring`
# namespace stack is Prometheus, no OTLP receiver), small PostgreSQL sizing.
# Image distribution: substrate components are the upstream v1.0.1 release
# images (ghcr.io/agent-substrate/substrate/*, multi-arch, digest-pinned in
# values.yaml); infra images are official upstream references. No pull secret
# needed. Workloads stay on amd64 via the chart's default nodeSelector (dell01
# is the only ate.dev/substrate node).

images:
  postgres:
    repository: docker.io/library/postgres
  rustfs:
    repository: docker.io/rustfs/rustfs
  awscli:
    repository: docker.io/amazon/aws-cli
  otelcollector:
    repository: docker.io/otel/opentelemetry-collector-contrib
  jaeger:
    repository: docker.io/jaegertracing/all-in-one

# All images are public (official upstream): no pull Secret, no
# imagePullSecrets.
imagePullSecrets: []

postgres:
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      # dell01 (sole amd64 worker, 6Gi allocatable) runs crossplane + istio
      # at ~97% of allocatable; a 256Mi request cannot schedule. Limit stays 2Gi.
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 2Gi

storage:
  backend: s3
  rustfs:
    enabled: true
    storage: 5Gi

otel:
  # In-chart collector + jaeger: the home cluster's monitoring stack has no
  # OTLP receiver, and `observability` namespace does not exist on talos.
  exporterOtlpEndpoint: "http://opentelemetry-collector.otel-system.svc:4317"
  exporterOtlpAddress: "http://opentelemetry-collector.otel-system.svc:4317"
  collector:
    enabled: true
  extraEnv:
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_METRIC_EXPORT_TIMEOUT: "10000"
    OTEL_LOGS_EXPORTER: otlp

ateapi:
  authentication:
    # kube-apiserver mints SA tokens with this issuer here (talos advertises
    # its LB endpoint, not the in-cluster default the chart assumes); ax's
    # server is the only client authenticating with SA JWTs.
    issuer: https://api.k8s.lan:6443
    # The issuer is kube-apiserver itself, reachable only via the LAN DNS name
    # (no cluster-internal resolution), so discovery uses the pod's own
    # projected service-account CA + token.
    inClusterDiscovery: true
  # api.k8s.lan resolves only via LAN /etc/hosts on the host; pods get DNS from
  # CoreDNS, whose upstreams don't serve the .lan zone. Pin the LB VIP.
  hostAliases:
  - ip: 192.168.68.91
    hostnames: [api.k8s.lan]
  authz:
    # ax-server creates atespaces, templates and actors with its own SA token
    # (google/ax installs it the same way: axdeploy GrantSubstrateAccess /
    # RenderSystemBundle append it to --authz-bootstrap-owners).
    bootstrapOwners:
      - system:serviceaccount:ate-system:ate-client
      - system:serviceaccount:ax-system:ax-server
  # rustfs bucket the bucket-init Job creates (templates/rustfs.yaml).
  snapshotLocation: s3://ate-snapshots/

# dell01 is tight on memory: one idp replica is enough for a single-node
# substrate (ax's local installer also runs one).
idpServer:
  replicas: 1

atenetRouter:
  # ax-server reaches task actors through the router's mTLS ingress
  # (ATENET_ROUTER_ADDR=https://atenet-router.ate-system.svc.cluster.local:443
  # with its podidentity client cert).
  ingressAllowedSpiffeIds:
    - spiffe://cluster.local/ns/ax-system/sa/ax-server

credentialProvider:
  # ax Gateway rules can inject credentials from Secrets labeled
  # ax.io/credential=true (google/ax installer's default policy).
  enabled: true
  namespacePolicies:
    - atespace: default
      allowedNamespaces: [ax-system, default]
      secretSelector:
        matchLabels:
          ax.io/credential: "true"

atelet:
  # Actor images pull from public ghcr.io anonymously — no GCP auth, no
  # localhost registry replacement (talos has no sidecar registry).
  extraArgs: []
