apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: atelet
  name: atelet
  namespace: ate-system
spec:
  selector:
    matchLabels:
      app: atelet
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: atelet
    spec:
      # Node object-store plugin (native sidecar, mandatory since v0.5): moves
      # snapshots and sandbox assets between this node and object storage over
      # a pod-local Unix socket. Starts before atelet so the socket exists when
      # it connects. Env mirrors manifests/ate-install/kind/atelet at v1.0.1.
      initContainers:
      - name: objectstore-plugin
        image: {{ .Values.images.objectStorePlugin.repository }}:{{ .Values.images.objectStorePlugin.tag }}
        restartPolicy: Always
        args:
        - node
        - --socket=/run/objectstore-plugin/node.sock
        - --root=/var/lib/ate
        - --asset-staging-dir=/var/lib/objectstore-plugin/asset-staging
        - --asset-staging-capacity=8Gi
        # The plugin listens on a Unix socket; the image has no shell, so the
        # binary checks itself.
        startupProbe:
          exec:
            command:
            - /ko-app/objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/node.sock
          periodSeconds: 2
          failureThreshold: 30
        # Reads/writes under the /var/lib/ate hostPath as root, like atelet.
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        env:
        # Object storage for snapshot transfers and sandbox assets. atelet
        # itself does not read these and exits if ATE_STORAGE_BACKEND is set.
        - name: ATE_STORAGE_BACKEND
          value: {{ .Values.storage.backend }}
        {{- if .Values.storage.rustfs.enabled }}
        # Local-cluster object store (see rustfs.yaml): static creds instead of IRSA.
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.rustfs.region | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.storage.rustfs.endpoint | quote }}
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        {{- end }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: ate-otel-config
        volumeMounts:
        - name: ate-base
          mountPath: /var/lib/ate
          mountPropagation: HostToContainer
        - name: objectstore-plugin
          mountPath: /run/objectstore-plugin
        - name: servicedns-ca
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: asset-staging
          mountPath: /var/lib/objectstore-plugin/asset-staging
      containers:
      - args:
        # No --image-credential-provider-*: those point at GKE node paths
        # (/home/kubernetes/bin, /etc/srv/kubernetes); actor images here are
        # public and pulled anonymously (same as upstream's kind overlay).
        - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --drain-delay=0s
        - --drain-timeout=5m
        - --objectstore-plugin-socket=/run/objectstore-plugin/node.sock
        {{- range .Values.atelet.extraArgs }}
        - {{ . | quote }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: {{ .Values.images.atelet.repository }}:{{ .Values.images.atelet.tag }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: atelet
        ports:
        # v1.0: atelet serves gRPC on the pod IP at 21998 (no hostPort).
        - containerPort: 21998
          name: grpc
        - containerPort: 9090
          name: prometheus
          protocol: TCP
        - containerPort: 9091
          name: health
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          # Deliberate deviation from upstream (CHOWN/DAC_OVERRIDE/FOWNER/FSETID
          # as root): runsc needs writable cgroupfs
          # (/sys/fs/cgroup/cgroup.subtree_control) at `start` time to set up
          # the sandbox cgroup; on talos an unprivileged container mounts
          # cgroupfs read-only and runsc start exits 128.
          privileged: true
        volumeMounts:
        - mountPath: /var/lib/ate
          mountPropagation: HostToContainer
          name: ate-base
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns-ca
          readOnly: true
        - mountPath: /var/lib/kubelet/plugins
          name: kubelet-plugins
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugins
        - mountPath: /host/dev
          name: host-dev
          readOnly: true
      nodeSelector:
        # Generic capability marker set once per node (nostos machineconfig);
        # never a version, so image-tag bumps roll out without re-labeling nodes.
        ate.dev/substrate: "true"
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      # v1.0 dropped the ate-node-critical PriorityClass; the
      # atelet-critical-pods ResourceQuota (priorityclasses.yaml) admits
      # system-*-critical pods outside kube-system.
      priorityClassName: system-cluster-critical
      serviceAccountName: atelet
      terminationGracePeriodSeconds: 330
      tolerations:
      - effect: NoSchedule
        key: ate.dev/sandboxClass
        operator: Exists
      volumes:
      - name: objectstore-plugin
        emptyDir: {}
      - name: asset-staging
        emptyDir: {}
      - hostPath:
          path: /var/lib/ate
          type: DirectoryOrCreate
        name: ate-base
      - hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
        name: kubelet-plugins
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
        name: device-plugins
      - hostPath:
          path: /dev
          type: Directory
        name: host-dev
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
