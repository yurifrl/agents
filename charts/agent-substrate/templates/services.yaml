apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ate-system
spec:
  clusterIP: None
  ipFamilyPolicy: PreferDualStack
  ports:
  - name: grpc
    port: 443
    protocol: TCP
    targetPort: 443
  # Control object-store plugin's credential exchange (atelet's node plugin
  # dials it on GCS).
  - name: exchange
    port: 8445
    protocol: TCP
    targetPort: 8445
  selector:
    app: ate-api-server

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ate-controller
  name: ate-controller
  namespace: ate-system
spec:
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: metrics
  selector:
    app: ate-controller

---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  ipFamilyPolicy: PreferDualStack
  # v1.0.1 static-mTLS agentgateway serves only https (443->8443) and
  # connect-tls (8444); the http/connect Service ports upstream still lists
  # have no listener behind them, so they are not rendered.
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8443
  - name: connect-tls
    port: 8444
    protocol: TCP
    targetPort: 8444
  - name: status
    port: 4040
    protocol: TCP
    targetPort: status
  - name: stats
    port: 15020
    protocol: TCP
    targetPort: stats
  selector:
    app: atenet-router
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: atenet-egress
  namespace: ate-system
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    app: atenet-egress
  type: ClusterIP
