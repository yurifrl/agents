{{- $snapshotLocation := required "ateapi.snapshotLocation must be set (v1.0 ate-api-server refuses to start without --snapshot-location, e.g. s3://ate-snapshots/)" .Values.ateapi.snapshotLocation -}}
{{- $owners := required "ateapi.authz.bootstrapOwners must list at least one principal" .Values.ateapi.authz.bootstrapOwners -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: {{ .Values.ateapi.replicas }}
  selector:
    matchLabels:
      app: ate-api-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
        # Rolls the pods when the env/config ConfigMaps or Secret change
        # (ate-setup stamps an equivalent env-hash annotation).
        ate.dev/env-hash: {{ toJson (list .Values.ateapi .Values.postgres) | sha256sum | trunc 16 | quote }}
      labels:
        app: ate-api-server
    spec:
      {{- with .Values.ateapi.hostAliases }}
      hostAliases:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      # The control object-store plugin deletes and copies external snapshots
      # for ate-api-server over a Unix socket in a pod-local emptyDir, and
      # serves the credential exchange on :8445 (GCS only; S3 answers
      # UNIMPLEMENTED and the S3 node plugin never calls it). A native sidecar
      # starts before ate-api-server and stops after it; ate-api-server starts
      # only once the startup probe sees the plugin serving (the image has no
      # shell, so the binary checks itself).
      - name: objectstore-plugin
        image: {{ .Values.images.objectStorePlugin.repository }}:{{ .Values.images.objectStorePlugin.tag }}
        restartPolicy: Always
        args:
        - control
        - --socket=/run/objectstore-plugin/control.sock
        - --exchange-listen=:8445
        - --actor-jwt-issuer=$(ATE_API_ACTOR_JWT_ISSUER)
        - --transfer-service-account=$(ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT)
        env:
        - name: ATE_STORAGE_BACKEND
          value: {{ .Values.storage.backend }}
        {{- if .Values.storage.rustfs.enabled }}
        # Local-cluster object store (see rustfs.yaml): static creds instead of IRSA.
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.rustfs.region | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.storage.rustfs.endpoint | quote }}
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        {{- end }}
        - name: ATE_API_ACTOR_JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              key: ATE_API_ACTOR_JWT_ISSUER
              name: ate-api-server-envvars
        - name: ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT
          valueFrom:
            configMapKeyRef:
              key: ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT
              name: ate-api-server-envvars
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - containerPort: 8445
          name: exchange
        startupProbe:
          exec:
            command:
            - /ko-app/objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/control.sock
          periodSeconds: 2
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - name: objectstore-plugin
          mountPath: /run/objectstore-plugin
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      containers:
      - args:
        - --grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --config-file=/run/apiconfig.ate.dev/apiconfig.textproto
        - --authentication-config=/etc/ateapi/authentication/authentication.yaml
        - --postgres-read-write-connection-string=@env
        - --postgres-owner-connection-string=@env
        - --postgres-read-write-role=@env
        - --postgres-owner-role=@env
        - --postgres-schema=@env
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --actor-jwt-issuer=@env
        - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
        - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --default-egress-gateway-address=atenet-egress.ate-system.svc:443
        # Graceful shutdown knobs. The sum must fit within terminationGracePeriodSeconds.
        - --drain-delay=13s
        - --drain-timeout=15s
        - --objectstore-plugin-socket=/run/objectstore-plugin/control.sock
        - --snapshot-location=@env
        # Global owners independent of the stored AccessPolicy (ate-setup's
        # --ateapi-authz-bootstrap-owners). Required since v1.0.
        - --authz-bootstrap-owners={{ join "," $owners }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        - configMapRef:
            name: ate-api-server-envvars
            optional: true
        - secretRef:
            name: ate-api-server-secret-envvars
            optional: true
        image: {{ .Values.images.ateapi.repository }}:{{ .Values.images.ateapi.tag }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: ate-api-server
        ports:
        - containerPort: 443
        - name: prometheus
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        volumeMounts:
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        # Separate owner and read/write login certificates; each login is its
        # certificate's CN, matching the bundled server's hba.
        - mountPath: /run/postgres.podcert.ate.dev
          name: postgres
          readOnly: true
        - mountPath: /run/actor-id-jwt-pool
          name: actor-id-jwt-pool
        - mountPath: /run/actor-id-ca-pool
          name: actor-id-ca-pool
          readOnly: true
        - mountPath: /run/apiconfig.ate.dev
          name: api-config
          readOnly: true
        - mountPath: /etc/ateapi/authentication
          name: authentication-config
          readOnly: true
        - mountPath: /run/postgres-server-ca
          name: postgres-server-ca
          readOnly: true
      serviceAccountName: ate-api-server
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      terminationGracePeriodSeconds: 40
      volumes:
      # Pod-local socket dir the control object-store plugin serves and
      # ate-api-server dials (objectstore-plugin-socket).
      - name: objectstore-plugin
        emptyDir: {}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: postgres
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: substrate_owner_user.pem
              keyType: ECDSAP256
              signerName: postgres.podcert.ate.dev/identity
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_owner_user
          - podCertificate:
              credentialBundlePath: substrate_readwrite_user.pem
              keyType: ECDSAP256
              signerName: postgres.podcert.ate.dev/identity
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_readwrite_user
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-jwt-pool
      - name: actor-id-ca-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-ca-pool
      - configMap:
          name: ate-api-config
        name: api-config
      - configMap:
          name: ate-api-authentication
        name: authentication-config
      - name: postgres-server-ca
        secret:
          optional: true
          secretName: postgres-server-ca
