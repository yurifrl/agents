{{- if .Values.sandbox.gvisor.enabled }}
# Cluster-wide (cluster-scoped since v1.0) SandboxConfig for the gVisor (runsc)
# sandbox class, from substrate v1.0.1 sandboxconfig-gvisor.yaml. atelet
# fetches the gVisor release tarball matching the worker node's architecture
# and extracts it locally (anonymous fetch of the public gs:// bucket).
apiVersion: ate.dev/v1
kind: SandboxConfig
metadata:
  name: gvisor-default
  annotations:
    # WorkerPools without configRef resolve the default for their sandbox
    # class via this annotation.
    sandboxconfig.ate.dev/is-class-default: "true"
spec:
  sandboxClass: gvisor
  # Runtime pieces are grouped into named versions; defaultVersion names the
  # one actors boot.
  defaultVersion: {{ .Values.sandbox.gvisor.defaultVersion }}
  versions:
    {{- toYaml .Values.sandbox.gvisor.versions | nindent 4 }}
{{- end }}
