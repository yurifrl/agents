apiVersion: v1
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.exporterOtlpEndpoint | quote }}
  {{- range $key, $value := .Values.otel.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system

---
apiVersion: v1
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      connect:
        mode: tunnel
      accessLog:
        add:
          substrate.connect.authority: 'destination.address + ":" + string(destination.port)'
      substrateEgressActorResolution:
        host: api.ate-system.svc:443
        policies:
          backendTLS:
            cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            root: /run/servicedns-ca/trust-bundle.pem

    # Keep the outer egress gateway on 8443, but bind it to this pod's
    # address. Numeric CONNECT re-entry must select the wildcard
    # internal bind instead of selecting this front door again.
    gateways:
      egress:
        port: 8443
        bindAddress: $POD_IP
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/actor-id-ca-certs/ca.crt

    binds:
    - mode: internal
      protocol: AUTO
      listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: /run/egress-mitm/tls.crt
          key: /run/egress-mitm/tls.key
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic: {}
            policies:
              backendTLS:
                root: /etc/ssl/certs/ca-certificates.crt
          policies:
            substrateEgress: &egressPolicy
              {{- if .Values.credentialProvider.enabled }}
              # ate-setup's #ATE_AGENTGATEWAY_CREDENTIAL_PROVIDERS block for
              # --credential-provider='{"name":"k8s.io"}'.
              credentialProviders:
              - uriAuthority: "k8s.io"
                target:
                  host: "k8s-credential-provider.ate-system.svc:50051"
                  policies:
                    backendTLS:
                      hostname: "k8s-credential-provider.ate-system.svc"
                      cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      root: /run/servicedns-ca/trust-bundle.pem
              {{- end }}
              host: api.ate-system.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns-ca/trust-bundle.pem
      - protocol: HTTP
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic:
              target: 'destination.address + ":" + string(destination.port)'
          policies:
            substrateEgress: *egressPolicy
      - protocol: TLS
        tcpRoutes:
        - backends:
          - dynamic: {}
kind: ConfigMap
metadata:
  name: atenet-egress-agentgateway-substrate-config
  namespace: ate-system

---
apiVersion: v1
data:
  # substrate v1.0.1 components/agentgateway-static-mtls (ate-setup always
  # composes it with the agentgateway dataplane): mTLS-only ingress, clients
  # authorized by SPIFFE ID; the plaintext :8080/:8081 listeners are gone.
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      statsAddr: 0.0.0.0:15020
      backend:
        # The dynamic-backend guard checks CONNECT authority before tunneling.
        # substrateIngress resolves ate-target-actor through ate-api-server to
        # select the worker's mTLS atunnel endpoint; atunnel uses only the
        # authority's port, so a loopback authority cannot dial the router's
        # own loopback. Ingress-only, all backends tunneled to atunnel.
        allowDynamicLoopback: true

    frontendPolicies:
      networkAuthorization:
        rules:
        - allow: >-
            source.spiffeId in {{ toJson (default (list) .Values.atenetRouter.ingressAllowedSpiffeIds) }}
      tracing:
        host: $AGENTGATEWAY_OTLP_ADDRESS
        protocol: grpc
        randomSampling: 0.01

    gateways:
      https:
        port: 8443
        protocol: HTTPS
        tls: &ingress-tls
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/podidentity.podcert.ate.dev/trust-bundle.pem

    backends:
    - name: dynamic
      dynamic: {}
      policies:
        # Actors use HTTP/1.1 unless the request is gRPC.
        http:
          version: HTTP/1.1
        # All actor traffic reaches atunnel over mTLS CONNECT.
        backendTunnel:
          proxy:
            backend: /dynamic
          mode: connect
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
              insecureHost: true

    routes:
    - name: substrate-actors
      gateways:
      - https
      matches:
      - path:
          pathPrefix: /
      policies: &substrate-ingress
        substrateIngress:
          host: api.ate-system.svc:443
          # AgentGateway only uses atunnel's CONNECT listener.
          connectTargetPort: 8443
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/servicedns-ca/trust-bundle.pem
      backends:
      - backend: /dynamic
    - name: substrate-actors-grpc
      gateways:
      - https
      matches: &grpc-matches
      - method: POST
        headers:
        - name: content-type
          value:
            regex: '(?i)^application/grpc([+;].*)?$'
      policies: *substrate-ingress
      backends: &grpc-backends
      - backend: /dynamic
        policies:
          http:
            version: HTTP/2.0

    # Terminate client CONNECT before internal HTTP routing.
    binds:
    - port: 8444
      tunnelProtocol: connect
      listeners:
      - protocol: HTTPS
        tls: *ingress-tls
        routes: []
    - mode: internal
      listeners:
      - protocol: HTTP
        routes:
        - name: substrate-actors-tunneled
          matches:
          - path:
              pathPrefix: /
          policies: *substrate-ingress
          backends:
          - backend: /dynamic
        - name: substrate-actors-tunneled-grpc
          matches: *grpc-matches
          policies: *substrate-ingress
          backends: *grpc-backends
kind: ConfigMap
metadata:
  name: atenet-router-agentgateway-config
  namespace: ate-system

---
# ate-api-server non-secret env, injected via the optional
# ate-api-server-envvars envFrom source (matches ate-setup v1.0.1
# steps/apienv.go CreateAPIServerEnvVars). Actor JWTs are minted by MintActorJWT and signed
# from the actor-id-jwt-pool secret; the issuer is the iss claim that relying
# parties discover via <issuer>/.well-known/openid-configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-server-envvars
  namespace: ate-system
data:
  ATE_API_POSTGRES_READ_WRITE_ROLE: {{ .Values.postgres.readWriteRole | quote }}
  ATE_API_POSTGRES_OWNER_ROLE: {{ .Values.postgres.ownerRole | quote }}
  ATE_API_ACTOR_JWT_ISSUER: {{ .Values.ateapi.actorJwtIssuer | quote }}
  # The control object-store sidecar expands $(ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT)
  # into its args, so the key must exist even when empty (s3).
  ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT: {{ .Values.ateapi.transferServiceAccount | quote }}
  ATE_API_SNAPSHOT_LOCATION: {{ .Values.ateapi.snapshotLocation | quote }}

---
# ate-api-server OIDC authentication config (ate-setup's
# `create api-authentication-config` step, ported to the chart).
# In-cluster issuer (talos, kind, self-hosted): not publicly discoverable, so
# discovery completes with the pod's own projected service-account CA+token.
# A GKE/external issuer (ateapi.authentication.issuer override) needs neither.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-authentication
  namespace: ate-system
data:
  # v1.0 parses this strictly (yaml.UnmarshalStrict): only jwtProviders is
  # accepted; the v0.5 actorIdentityJWTProvider key would crash ate-api-server.
  authentication.yaml: |
    jwtProviders:
    - name: kubernetes
      issuer: {{ .Values.ateapi.authentication.issuer }}
      audiences: [api.ate-system.svc]
      {{- if or (eq .Values.ateapi.authentication.issuer "https://kubernetes.default.svc") .Values.ateapi.authentication.inClusterDiscovery }}
      certificateAuthorityFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      discoveryTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      {{- end }}

---
# ate-api-server config file (--config-file; ate-setup v1.0 `create
# api-config`, prototext of ateconfigpb.APIConfig).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-config
  namespace: ate-system
data:
  apiconfig.textproto: |
    logging: {
      level: {{ .Values.ateapi.logLevel | quote }}
    }
