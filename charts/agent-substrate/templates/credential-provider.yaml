{{- if .Values.credentialProvider.enabled }}
# Ported verbatim from substrate v1.0.1 manifests/egress-credential-injection
# (what ate-setup applies for --credential-provider={"name":"k8s.io"}); only
# the image, nodeSelector and the namespace policy are templated.
---

# The credential provider: a gRPC service that resolves ate-secret:// URIs
# of the k8s.io class to Kubernetes Secret values. It is the ONLY
# component in the egress credential-injection path with Kubernetes access; the
# egress gateway and the injector never read Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-credential-provider
  namespace: ate-system
---
# POC scope note: this grants read on Secrets cluster-wide so a policy can name a
# Secret in any namespace. A production deployment would scope this to the
# namespaces a provider instance is allowed to serve.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-credential-provider-secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-credential-provider-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-credential-provider-secret-reader
subjects:
- kind: ServiceAccount
  name: k8s-credential-provider
  namespace: ate-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-credential-provider
  namespace: ate-system
  labels:
    app: k8s-credential-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-credential-provider
  template:
    metadata:
      labels:
        app: k8s-credential-provider
      annotations:
        checksum/namespace-policy: {{ toJson .Values.credentialProvider.namespacePolicies | sha256sum | trunc 16 | quote }}
    spec:
      serviceAccountName: k8s-credential-provider
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: k8s-credential-provider
        image: {{ .Values.images.credentialProvider.repository }}:{{ .Values.images.credentialProvider.tag }}
        args:
        - "--listen-address=:50051"
        - "--metrics-address=:9090"
        - "--health-address=:9091"
        # The /statusz page binds 127.0.0.1 for port-forward access.
        - "--status-address=127.0.0.1:4040"
        # Serve with the pod's servicedns identity (SAN k8s-credential-provider.ate-system.svc)
        # and require the injector to present a podidentity client cert whose chain
        # verifies against the trust bundle. The provider additionally pins the
        # caller's SAN to the egress gateway's identity
        # (spiffe://cluster.local/ns/ate-system/sa/atenet-egress), so no other
        # CA-trusted workload can fetch secrets.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        # Enforce the atespace→namespace authorization policy (default-deny).
        - "--namespace-policy-file=/etc/k8s-credential-provider/namespace-policy.yaml"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: namespace-policy
          mountPath: /etc/k8s-credential-provider
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: namespace-policy
        configMap:
          name: k8s-credential-provider-namespace-policy
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: k8s-credential-provider
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
---
# Only the egress gateway may reach the provider's gRPC port; every other
# connection to the provider pods is dropped. The provider also pins the
# client certificate to the gateway's identity (see the Deployment), so this
# keeps other pods from reaching it at all. Takes effect only on a cluster
# whose network plugin enforces NetworkPolicy, such as GKE Dataplane V2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 50051
---
# atespace -> namespace authorization for the provider (default-deny when
# empty). ate-setup creates it once with `policies: []`; google/ax's installer
# then adds its atespace/namespace grant. Rendered from
# credentialProvider.namespacePolicies; the checksum annotation on the
# Deployment restarts the provider when it changes (it reads the file once).
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: ate-system
data:
  namespace-policy.yaml: |
    policies: {{- if .Values.credentialProvider.namespacePolicies }}
    {{- toYaml .Values.credentialProvider.namespacePolicies | nindent 4 }}
    {{- else }} []
    {{- end }}
{{- end }}
